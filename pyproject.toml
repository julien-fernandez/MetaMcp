[project]
name = "metamcp"
version = "2.0.0"
description = "HTTP multiplexer that proxies multiple stdio MCP servers behind a single endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    # watchfiles removed: Rust backend spawns find.exe on Windows causing IO storms
    "python-dotenv>=1.0.0",
]

[project.scripts]
metamcp = "metamcp.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
